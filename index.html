    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Applies the theme before first paint so there is no light-mode flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored !== 'light') {
            document.documentElement.classList.add('dark');
            if (stored !== 'dark') localStorage.setItem('theme', 'dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
